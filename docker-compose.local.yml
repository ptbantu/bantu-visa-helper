version: '3.8'

services:
  app:
    build: .
    container_name: visa-app
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./prisma/prod.db
    volumes:
      - ./prisma:/app/prisma
    restart: unless-stopped
    networks:
      - visa-network
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: visa-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - visa-network

networks:
  visa-network:
    driver: bridge
