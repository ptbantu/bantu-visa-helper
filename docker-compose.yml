services:
  # Next.js 应用服务
  bantu-visa-helper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bantu-visa-helper
    ports:
      - "8081:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bantu-network

networks:
  bantu-network:
    driver: bridge
